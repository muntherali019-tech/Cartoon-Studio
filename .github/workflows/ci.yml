name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build & server smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Server smoke test
        env:
          ANTHROPIC_API_KEY: sk-ant-dummy
        run: |
          node server/index.js &
          SRV=$!
          trap 'kill $SRV 2>/dev/null' EXIT
          for i in $(seq 1 20); do
            curl -sf http://localhost:8787/api/health >/dev/null && break
            sleep 0.5
          done
          echo "health:"; curl -s http://localhost:8787/api/health
          curl -s http://localhost:8787/api/health | grep -q '"ok":true'
          # missing action / bad body -> 400 (validation)
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/api/generate \
            -H 'Content-Type: application/json' -d '{}')" = "400"
          # arbitrary system+messages (proxy abuse attempt) -> 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8787/api/generate \
            -H 'Content-Type: application/json' -d '{"system":"x","messages":[]}')" = "400"
          # unknown api route -> JSON 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/nope)" = "404"

  docker:
    name: Docker image + Redis smoke test
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cartoon-studio:ci .
      - name: Run container against Redis
        run: |
          docker run -d --name cs --network host \
            -e ANTHROPIC_API_KEY=sk-ant-dummy \
            -e REDIS_URL=redis://localhost:6379 \
            -e PORT=8787 \
            cartoon-studio:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/api/health >/dev/null && break
            sleep 1
          done
          echo "health:"; curl -s http://localhost:8787/api/health
          curl -s http://localhost:8787/api/health | grep -q '"ok":true'
          # the built image should connect to Redis (shared store), not fall back
          docker logs cs | grep -q "via Redis"
      - name: Container logs
        if: always()
        run: docker logs cs || true
      - name: Cleanup
        if: always()
        run: docker rm -f cs || true

  deploy:
    name: Deploy (prod)
    needs: [build, docker] # only deploy if the whole test suite passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # Add these as repo secrets (Settings > Secrets and variables > Actions).
      # Each step self-skips if its secret is absent, so this job is a safe no-op
      # until you provide them.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Deploy to Netlify
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: npx --yes netlify-cli deploy --build --prod
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"

  preview:
    name: Netlify preview (PR)
    needs: [build, docker] # only preview if the test suite passed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # to post the preview-URL comment
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy draft to Netlify
        id: netlify
        # self-skips on forks / before secrets are added (no secret -> empty)
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: |
          url=$(npx --yes netlify-cli deploy --json --dir=dist --functions=netlify/functions \
            | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{process.stdout.write(JSON.parse(d).deploy_url||'')}catch{process.stdout.write('')}})")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "🚀 Netlify preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Comment preview URL on the PR
        if: steps.netlify.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.netlify.outputs.url }}
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            const marker = '<!-- netlify-preview -->';
            const body = `${marker}\n🚀 **Netlify preview**: ${url}\n\n_Updated automatically on each push to this PR._`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
